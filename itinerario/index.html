<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="shell-type" content="web_standard">
  <title>Mi Itinerario | Planify</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="logica.js"></script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased">
<header class="fixed top-0 z-50 w-full bg-primary-container shadow-sm print:hidden">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 md:px-8">
    <a class="flex items-center gap-2" href="../index.html"><img class="h-8 w-auto" src="../imagenes/planify-logo.png" alt="Planify"><span class="font-title-lg text-on-primary font-bold">Planify</span></a>
    <nav class="hidden items-center gap-6 md:flex" aria-label="Navegación principal">
      <a class="text-inverse-on-surface hover:text-secondary-fixed" href="../index.html">Explorar</a>
      <a class="text-inverse-on-surface hover:text-secondary-fixed" href="../favoritos/index.html">Favoritos</a>
      <a aria-current="page" class="border-b-2 border-secondary-fixed py-2 font-bold text-secondary-fixed" href="index.html">Mi Itinerario</a>
      <a class="text-inverse-on-surface hover:text-secondary-fixed" href="../Acerca%20de/index.html">Acerca de</a>
    </nav>
  </div>
</header>
<main class="min-h-screen px-4 pb-12 pt-24 md:px-8">
  <div class="mx-auto max-w-7xl">
    <section class="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
      <div><p class="font-label-sm uppercase tracking-wider text-secondary">Planificación de viajes</p><h1 class="mt-1 text-3xl font-bold text-primary">Mi Itinerario</h1></div>
      <div class="flex flex-wrap gap-2">
        <div class="relative hidden min-w-64" id="trip-selector-container"><label class="sr-only" for="trip-selector">Seleccionar itinerario</label><select id="trip-selector" class="w-full appearance-none rounded-lg bg-white px-4 py-3 pr-10 text-primary shadow-sm"></select><span class="material-symbols-outlined pointer-events-none absolute right-3 top-3 text-outline">expand_more</span></div>
        <button id="open-trip-modal" class="inline-flex items-center gap-2 rounded-lg bg-on-tertiary-container px-4 py-3 font-semibold text-white hover:bg-tertiary-container" type="button"><span class="material-symbols-outlined">add</span>Nuevo plan de viaje</button>
      </div>
    </section>

    <section class="hidden space-y-6" id="trip-dashboard">
      <div class="grid gap-4 rounded-xl bg-white p-5 shadow-sm lg:grid-cols-[1.5fr_1fr_1fr]">
        <div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><span class="rounded-full bg-secondary-fixed px-3 py-1 text-xs font-bold text-secondary">BORRADOR</span><button class="ml-auto text-sm font-semibold text-primary hover:underline" id="edit-trip-btn" type="button">Editar</button><button class="text-sm font-semibold text-error hover:underline" id="delete-trip-btn" type="button">Eliminar plan</button></div><h2 class="mt-3 break-words text-2xl font-bold text-primary" id="trip-name"></h2><p class="mt-1 text-on-surface-variant" id="trip-destination"></p><p class="mt-1 text-sm text-on-surface-variant" id="trip-dates"></p><p class="mt-3 break-words text-sm text-on-surface-variant" id="trip-notes"></p></div>
        <div class="rounded-lg bg-surface-container-low p-4"><p class="text-xs font-bold uppercase text-outline">Presupuesto</p><p class="mt-2 text-xl font-bold text-primary" id="trip-budget"></p><div class="mt-3 h-2 overflow-hidden rounded-full bg-surface-container-high"><div class="h-full rounded-full bg-secondary" id="budget-progress"></div></div><p class="mt-2 text-sm text-on-surface-variant" id="budget-summary"></p></div>
        <div class="rounded-lg bg-surface-container-low p-4"><p class="text-xs font-bold uppercase text-outline">Resumen</p><p class="mt-2 text-xl font-bold text-primary" id="activity-summary"></p><p class="mt-2 text-sm text-on-surface-variant" id="reservation-summary"></p></div>
      </div>
      <nav class="flex gap-2 overflow-x-auto" aria-label="Secciones del itinerario">
        <button class="trip-tab rounded-lg bg-primary px-4 py-2 font-semibold text-white" data-view="activities" type="button">Cronograma</button>
        <button class="trip-tab rounded-lg bg-white px-4 py-2 font-semibold text-primary" data-view="expenses" type="button">Gastos</button>
        <button class="trip-tab rounded-lg bg-white px-4 py-2 font-semibold text-primary" data-view="map" type="button">Mapa</button>
        <button class="trip-tab rounded-lg bg-white px-4 py-2 font-semibold text-primary" data-view="reservations" type="button">Reservas</button>
      </nav>
      <section id="trip-view" class="min-h-64 rounded-xl bg-white p-5 shadow-sm" aria-live="polite"></section>
      <section class="flex flex-wrap gap-2 print:hidden">
        <button class="rounded-lg bg-surface-container px-4 py-2 font-semibold text-primary hover:bg-surface-container-high" id="export-ics-btn" type="button">Exportar calendario (.ics)</button>
        <button class="rounded-lg bg-secondary px-4 py-2 font-semibold text-white hover:bg-on-secondary-container" id="print-trip-btn" type="button">Descargar / imprimir PDF</button>
        <button class="rounded-lg bg-surface-container px-4 py-2 font-semibold text-primary hover:bg-surface-container-high" id="share-trip-btn" type="button">Compartir plan</button>
      </section>
    </section>
  </div>
</main>

<div class="modal-overlay" id="trip-modal" role="dialog" aria-modal="true" aria-labelledby="trip-modal-title" hidden>
  <section class="modal-card">
    <div class="mb-5 flex items-center justify-between"><div><p class="text-xs font-bold uppercase tracking-wider text-secondary">Borrador</p><h2 class="text-xl font-bold text-primary" id="trip-modal-title">Nuevo plan de viaje</h2></div><button class="rounded-lg p-2 text-outline hover:bg-surface-container" id="close-trip-modal" type="button" aria-label="Cerrar">✕</button></div>
    <form id="trip-form" class="space-y-4">
      <label class="block text-sm font-semibold text-on-surface">Nombre del viaje<input class="form-field" name="nombre" required minlength="3" maxlength="100"></label>
      <label class="block text-sm font-semibold text-on-surface">Destino<input class="form-field" name="destino" required maxlength="120"></label>
      <div class="grid grid-cols-2 gap-3"><label class="block text-sm font-semibold text-on-surface">Fecha de inicio<input class="form-field" name="inicio" type="date" required></label><label class="block text-sm font-semibold text-on-surface">Fecha de fin<input class="form-field" name="fin" type="date" required></label></div>
      <label class="block text-sm font-semibold text-on-surface">Presupuesto estimado (USD)<input class="form-field" name="presupuesto" type="number" min="0" step="0.01"></label>
      <label class="block text-sm font-semibold text-on-surface">Notas y preferencias<textarea class="form-field" name="notas" rows="3" maxlength="1000"></textarea></label>
      <p class="hidden rounded-lg bg-error-container p-3 text-sm text-on-error-container" id="trip-error" role="alert"></p>
      <div class="flex justify-end gap-2"><button class="rounded-lg px-4 py-2 font-semibold text-primary hover:bg-surface-container" id="cancel-trip-modal" type="button">Cancelar</button><button class="rounded-lg bg-on-tertiary-container px-4 py-2 font-semibold text-white" type="submit">Guardar plan</button></div>
    </form>
  </section>
</div>
<div class="modal-overlay" id="item-modal" role="dialog" aria-modal="true" hidden>
  <section class="modal-card"><div class="mb-5 flex items-center justify-between"><h2 class="text-xl font-bold text-primary" id="item-modal-title"></h2><button class="rounded-lg p-2 text-outline hover:bg-surface-container" data-close-item type="button" aria-label="Cerrar">✕</button></div><form id="item-form" class="space-y-4"><div id="item-fields" class="space-y-4"></div><p class="hidden rounded-lg bg-error-container p-3 text-sm text-on-error-container" id="item-error" role="alert"></p><div class="flex justify-end gap-2"><button class="rounded-lg px-4 py-2 font-semibold text-primary hover:bg-surface-container" data-close-item type="button">Cancelar</button><button class="rounded-lg bg-secondary px-4 py-2 font-semibold text-white" type="submit">Guardar</button></div></form></section>
</div>
<footer class="bg-surface-container py-6 text-center text-sm text-on-surface-variant"><span class="footer-copyright">© 2026 Planify</span></footer>
</body>
</html>
